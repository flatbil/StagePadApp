name: MDBuddy
options:
  bundleIdPrefix: com.nuthouse
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

targets:
  MDBuddy:
    type: application
    platform: iOS
    sources:
      - path: StagePad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuthouse.MDBuddy
        INFOPLIST_FILE: StagePad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
